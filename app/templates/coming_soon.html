{% extends "base.html" %}
{% from "components/macros.html" import icon %}

{% block title %}{{ heading }} · Pocketly{% endblock %}

{% block content %}
<section class="container-page flex justify-center py-16 sm:py-24">
  <div class="card w-full max-w-md text-center sm:p-10">
    <p class="inline-flex rounded-full bg-cream-dark px-3 py-1 text-xs font-semibold uppercase tracking-wider text-ink-soft">Coming soon</p>
    <h1 class="mt-5 text-3xl font-extrabold tracking-tight sm:text-4xl">{{ heading }}</h1>
    <p class="mt-3 text-ink-soft">{{ message }}</p>
    <a href="{{ url_for('main.landing') }}" class="btn-ghost mt-8">{{ icon("arrow-left", "h-4 w-4") }}Back to home</a>
  </div>
</section>
{% endblock %}
